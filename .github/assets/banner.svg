<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" rx="16" fill="url(#bg)" />

  <!-- Background Glow & Grid accents -->
  <circle cx="150" cy="100" r="140" fill="#10b981" opacity="0.12" filter="blur(40px)" />
  <circle cx="1050" cy="380" r="160" fill="#6366f1" opacity="0.15" filter="blur(50px)" />

  <!-- Header Text -->
  <g transform="translate(60, 55)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#065f46" opacity="0.6" stroke="#10b981" stroke-width="1" />
    <text x="110" y="18" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">LARAVEL 12 + FILAMENT v5</text>
    
    <!-- Title -->
    <text x="0" y="65" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">⚡ NexPOS &amp; Booking System</text>
    <text x="0" y="92" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">The Ultimate Open-Source Point of Sale &amp; Service Appointment Starter Kit</text>
  </g>

  <!-- Quick Badges on Right -->
  <g transform="translate(930, 55)">
    <rect x="0" y="0" width="210" height="70" rx="12" fill="#1f2937" stroke="#374151" stroke-width="1" />
    <text x="20" y="28" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">TODAY'S REVENUE</text>
    <text x="20" y="54" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">Rp 4.850.000</text>
  </g>

  <!-- CARD 1: POS REGISTER TERMINAL -->
  <g transform="translate(60, 170)" filter="url(#shadow)">
    <rect width="440" height="260" rx="14" fill="url(#cardGrad)" stroke="#374151" stroke-width="1" />
    
    <!-- Terminal Header -->
    <rect width="440" height="38" rx="14" fill="#1f2937" />
    <circle cx="20" cy="19" r="5" fill="#ef4444" />
    <circle cx="36" cy="19" r="5" fill="#f59e0b" />
    <circle cx="52" cy="19" r="5" fill="#10b981" />
    <text x="75" y="24" fill="#d1d5db" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Interactive POS Register</text>
    
    <!-- Search Bar -->
    <rect x="20" y="52" width="400" height="28" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="32" y="70" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">🔍 Search caramel macchiato, haircut, facial...</text>

    <!-- Product Grid Mockup -->
    <!-- Item 1 -->
    <rect x="20" y="92" width="125" height="100" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="30" y="112" fill="#38bdf8" font-size="10" font-weight="700">BEVERAGE</text>
    <text x="30" y="132" fill="#ffffff" font-size="12" font-weight="700">Caramel Macchiato</text>
    <text x="30" y="172" fill="#10b981" font-size="12" font-weight="800">Rp 32.000</text>

    <!-- Item 2 -->
    <rect x="157" y="92" width="125" height="100" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="167" y="112" fill="#a855f7" font-size="10" font-weight="700">SERVICE</text>
    <text x="167" y="132" fill="#ffffff" font-size="12" font-weight="700">Gentleman Haircut</text>
    <text x="167" y="172" fill="#10b981" font-size="12" font-weight="800">Rp 65.000</text>

    <!-- Item 3 -->
    <rect x="295" y="92" width="125" height="100" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="305" y="112" fill="#f59e0b" font-size="10" font-weight="700">BAKERY</text>
    <text x="305" y="132" fill="#ffffff" font-size="12" font-weight="700">Flaky Croissant</text>
    <text x="305" y="172" fill="#10b981" font-size="12" font-weight="800">Rp 25.000</text>

    <!-- Bottom Action -->
    <rect x="20" y="206" width="400" height="38" rx="8" fill="url(#primaryGrad)" />
    <text x="220" y="230" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">⚡ Instant Add to Reactive Cart</text>
  </g>

  <!-- CARD 2: REAL-TIME CART & QRIS CHECKOUT -->
  <g transform="translate(525, 170)" filter="url(#shadow)">
    <rect width="330" height="260" rx="14" fill="url(#cardGrad)" stroke="#374151" stroke-width="1" />
    
    <rect width="330" height="38" rx="14" fill="#1f2937" />
    <text x="20" y="24" fill="#d1d5db" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Cart &amp; Payment Modal</text>

    <!-- Cart Row 1 -->
    <g transform="translate(20, 55)">
      <text x="0" y="14" fill="#ffffff" font-size="11" font-weight="600">Caramel Macchiato (x1)</text>
      <text x="290" y="14" fill="#d1d5db" font-size="11" font-weight="600" text-anchor="end">Rp 32.000</text>
    </g>
    <!-- Cart Row 2 -->
    <g transform="translate(20, 80)">
      <text x="0" y="14" fill="#ffffff" font-size="11" font-weight="600">Gentleman Haircut (x1)</text>
      <text x="290" y="14" fill="#d1d5db" font-size="11" font-weight="600" text-anchor="end">Rp 65.000</text>
    </g>

    <!-- Divider -->
    <line x1="20" y1="110" x2="310" y2="110" stroke="#374151" stroke-dasharray="4,4" />

    <!-- Subtotal & Grand Total -->
    <g transform="translate(20, 125)">
      <text x="0" y="14" fill="#9ca3af" font-size="11">Subtotal</text>
      <text x="290" y="14" fill="#ffffff" font-size="11" font-weight="600" text-anchor="end">Rp 97.000</text>

      <text x="0" y="32" fill="#10b981" font-size="13" font-weight="800">Grand Total</text>
      <text x="290" y="32" fill="#10b981" font-size="15" font-weight="800" text-anchor="end">Rp 97.000</text>
    </g>

    <!-- Payment Badges -->
    <g transform="translate(20, 175)">
      <rect x="0" y="0" width="88" height="28" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1" />
      <text x="44" y="18" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">💵 TUNAI</text>

      <rect x="98" y="0" width="88" height="28" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="142" y="18" fill="#a5b4fc" font-size="10" font-weight="700" text-anchor="middle">📱 QRIS</text>

      <rect x="196" y="0" width="94" height="28" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="243" y="18" fill="#9ca3af" font-size="10" font-weight="700" text-anchor="middle">💳 TRANSFER</text>
    </g>

    <rect x="20" y="215" width="290" height="30" rx="6" fill="#10b981" />
    <text x="165" y="235" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">✓ Selesaikan Pembayaran</text>
  </g>

  <!-- CARD 3: THERMAL RECEIPT & APPOINTMENT SYNC -->
  <g transform="translate(880, 170)" filter="url(#shadow)">
    <rect width="260" height="260" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    
    <text x="130" y="30" fill="#111827" font-family="Courier, monospace" font-size="12" font-weight="800" text-anchor="middle">⚡ NEXPOS STORE</text>
    <text x="130" y="44" fill="#6b7280" font-family="Courier, monospace" font-size="9" text-anchor="middle">INV-20261101-0001</text>
    
    <line x1="20" y1="55" x2="240" y2="55" stroke="#9ca3af" stroke-dasharray="3,3" />

    <!-- Items -->
    <text x="20" y="75" fill="#111827" font-family="Courier, monospace" font-size="10" font-weight="700">Caramel Macchiato</text>
    <text x="240" y="75" fill="#111827" font-family="Courier, monospace" font-size="10" text-anchor="end">32.000</text>

    <text x="20" y="95" fill="#111827" font-family="Courier, monospace" font-size="10" font-weight="700">Gentleman Haircut</text>
    <text x="240" y="95" fill="#111827" font-family="Courier, monospace" font-size="10" text-anchor="end">65.000</text>

    <line x1="20" y1="110" x2="240" y2="110" stroke="#9ca3af" stroke-dasharray="3,3" />

    <text x="20" y="130" fill="#111827" font-family="Courier, monospace" font-size="11" font-weight="800">TOTAL: Rp 97.000</text>
    <text x="20" y="146" fill="#10b981" font-family="Courier, monospace" font-size="9" font-weight="700">PAID VIA QRIS</text>
    
    <!-- Mini QR Icon -->
    <rect x="95" y="160" width="70" height="60" rx="4" fill="#111827" />
    <text x="130" y="195" fill="#ffffff" font-family="Courier, monospace" font-size="9" text-anchor="middle">QR CODE</text>

    <text x="130" y="240" fill="#6b7280" font-family="Courier, monospace" font-size="8" text-anchor="middle">THANK YOU FOR YOUR VISIT!</text>
  </g>
</svg>
